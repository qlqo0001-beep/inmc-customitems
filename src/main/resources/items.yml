# ============================================================
#  커스텀 아이템
# ============================================================
#  /커스텀아이템 관리 에서 전부 GUI 로 만들고 고칠 수 있습니다.
#  손으로 고쳤다면 /커스텀아이템 리로드 를 실행하세요.
#
#  여기서 만든 아이템은 다른 INMC 플러그인 전부에서 **inmc:아이디** 로 씁니다.
#
#  [모양]
#    material           바탕이 되는 바닐라 아이템
#    display-name       표시 이름. 등급 색이 앞에 저절로 붙습니다
#    lore               설명. 등급·능력치·기능 줄은 저절로 붙으니 적지 마세요
#    custom-model-data  리소스팩 모델 번호
#    enchants           인챈트 id → 레벨. 바닐라 상한을 넘겨도 됩니다
#    flags              숨김 옵션 (HIDE_ENCHANTS 등)
#    glow               인챈트 없이 반짝이게
#    unbreakable        닳지 않게
#    max-durability     최대 내구도. 0 이면 바닐라 기본값
#
#  [분류]
#    type   weapon / armor / tool / consumable / accessory / talisman / relic /
#           material / gem / misc
#           talisman(부적)·relic(유물)은 가방·장착 칸에서 효과가 납니다. 유물은 한 번에 하나만.
#    tier   common / uncommon / rare / epic / legendary / mythic
#    category  소분류 id (categories.yml). 종류 아래의 서랍 — 표시와 걸러보기 전용
#
#  [능력치] stats
#    바닐라로 내려가는 것: attack-damage, attack-speed, armor, armor-toughness,
#                          max-health, movement-speed, knockback-resistance, luck,
#                          attack-knockback
#    이 플러그인이 계산하는 것: crit-chance(%), crit-damage(배), lifesteal(%),
#                               damage-bonus, damage-reduction(%), thorns
#
#  [기능] abilities — 번호 순서대로 터집니다
#    trigger   right-click / left-click / on-hit / on-kill / when-damaged / passive
#    effect    potion / damage / heal / ignite / lightning / launch / teleport /
#              sound / particle / command / message
#    chance    발동 확률(%). 없으면 100
#    cooldown  재사용 대기 시간(초)
#    interval  passive 일 때 발동 주기(초)
#    values    효과마다 요구하는 값이 다릅니다. GUI 가 알려줍니다
#
#  [연동 값] data
#    **다른 플러그인이 읽는 값입니다.** 이 플러그인은 뜻을 모릅니다.
#    예: fishing.reel-power 를 적으면 낚시가 이 아이템을 낚싯대로 씁니다.
#
#  [그 밖에] set(세트) · sockets(보석 칸) · gem(보석) · consume(소모·강화석) ·
#            upgrade(강화) · requirement(요구 조건) · components(1.21 부품)
#    전부 GUI 에서 설명과 함께 고칠 수 있습니다.
#
#  아래 "MMOItems 에서 옮겨 온 것" 은 기존 서버의 MMOItems 아이템입니다.
#  필요 없으면 지워도 됩니다.
# ============================================================
items:

  # 예시 1 — 기능이 붙은 무기.
  # 우클릭하면 8칸 앞으로 순간이동하고, 때리면 30% 확률로 번개가 칩니다.
  example_blade:
    material: NETHERITE_SWORD
    type: weapon
    tier: legendary
    display-name: "섬광검"
    lore:
      - "&7번개를 머금은 검."
    glow: true
    # pack/textures/ 에 이 이름으로 png 를 넣고 /커스텀아이템 리팩 빌드 하면
    # 모델까지 자동으로 만들고 아이템에 item_model 이 붙습니다.
    # 파일이 없으면 빌드 보고서에 적히고 바닐라 모양으로 나옵니다.
    texture: "example_blade.png"
    stats:
      attack-damage: 9.0
      attack-speed: -2.0
      crit-chance: 25.0
      crit-damage: 2.5
      lifesteal: 8.0
    abilities:
      0:
        trigger: right-click
        effect: teleport
        cooldown: 6.0
        values:
          distance: "8"
      1:
        trigger: right-click
        effect: sound
        cooldown: 6.0
        values:
          sound: ENTITY_ENDERMAN_TELEPORT
          volume: "1"
          pitch: "1.2"
      2:
        trigger: on-hit
        effect: lightning
        chance: 30.0
        values:
          target: other
          damage: "1"

  # 예시 2 — 낚싯대. **낚시 플러그인이 이 data 를 읽습니다.**
  # 낚시에서 따로 등록할 필요 없이 여기서 만들면 됩니다.
  example_rod:
    material: FISHING_ROD
    type: tool
    tier: epic
    display-name: "심해의 낚싯대"
    lore:
      - "&7깊은 곳의 것들이 끌려 올라옵니다."
    unbreakable: true
    data:
      fishing.rod: "1"
      fishing.reel-power: "15"
      fishing.line-strength: "30"
      fishing.reel-durability: "15"
      fishing.big-fish-chance: "2"
      fishing.double-chance: "3"
      fishing.max-fatigue: "500"
      fishing.fatigue-recovery: "50"
      fishing.grade-bonus.a: "3"
      fishing.grade-bonus.s: "2"

  # 예시 3 — 지속 기능이 붙은 방어구.
  # 착용한 동안 10초마다 재생 효과를 받습니다.
  example_crown:
    material: GOLDEN_HELMET
    type: armor
    tier: mythic
    display-name: "재생의 왕관"
    lore:
      - "&7쓰고 있으면 상처가 아뭅니다."
    stats:
      armor: 4.0
      max-health: 4.0
      damage-reduction: 10.0
      thorns: 2.0
    abilities:
      0:
        trigger: passive
        effect: potion
        interval: 10.0
        values:
          effect: REGENERATION
          seconds: "4"
          level: "1"
          target: self
