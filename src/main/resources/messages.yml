# ============================================================
#  inmc-customitems — 메시지
# ============================================================
# MiniMessage 표기를 씁니다: <red>빨강</red>, <gradient:#a:#b>…</gradient>
# 예전 색코드(&c, §c)도 그대로 읽힙니다.
#
# 줄을 통째로 지우면 내장 기본값이 나갑니다. 빈 문자열("")로 두면 그 메시지를 끕니다.
# 토큰은 한글/영문 둘 다 됩니다 — {아이템} = {item}, {수량} = {amount} …
#
# ⚠ 이 파일의 키 목록은 코드의 기본값 표와 **정확히 일치해야** 합니다.
#   ResourceTest 가 그걸 지킵니다.
# ============================================================
prefix: "<gradient:#ffd76a:#ffb347>[ 아이템 ]</gradient> "

# --- 등록 ---
registered: "<green>'{item}' 로 등록했습니다.</green>"
unregistered: "<green>'{item}' 등록을 해제했습니다.</green>"
already-exists: "<red>'{item}' 은(는) 이미 있습니다.</red>"
invalid-name: "<red>이름 규칙에 맞지 않습니다: {item}</red>"
unknown-item: "<red>'{item}' 라는 아이템이 없습니다.</red>"
unknown-set: "<red>'{item}' 라는 세트가 없습니다.</red>"
hand-empty: "<red>손에 아이템을 들고 있어야 합니다.</red>"

# --- 지급 ---
given: "<green>{player} 에게 {item} {amount}개를 지급했습니다.</green>"
received: "<green>{item} {amount}개를 받았습니다.</green>"
player-not-found: "<red>'{player}' 을(를) 찾을 수 없습니다.</red>"
inventory-full: "<yellow>인벤토리가 가득 차 바닥에 떨어뜨렸습니다.</yellow>"

# --- 갱신 ---
refreshed: "<green>손에 든 아이템을 최신 정의로 다시 만들었습니다.</green>"
not-ours: "<red>이 플러그인이 만든 아이템이 아닙니다.</red>"
definition-gone: "<red>'{item}' 정의가 더 이상 없습니다.</red>"

# 보석
gem-socketed: "<aqua>{item}<aqua> 을(를) 박았습니다.</aqua>"
gem-failed: "<red>{item}<red> 이(가) 깨졌습니다.</red>"
gem-no-socket: "<red>{item}<red> 이(가) 맞는 빈 소켓이 없습니다.</red>"

# 소모품·요구 조건
consume-cooldown: "<red>{item}<red> 은(는) {amount}초 뒤에 다시 쓸 수 있습니다.</red>"
require-level: "<red>{item}<red> 은(는) 레벨 {amount} 이상이어야 씁니다.</red>"
require-permission: "<red>{item}<red> 을(를) 쓸 권한이 없습니다.</red>"
gem-removed: "<aqua>{item}<aqua> 을(를) 빼냈습니다.</aqua>"
gem-nothing: "<red>빼낼 보석이 없습니다.</red>"
repaired: "<green>{item}<green> 을(를) {amount} 만큼 고쳤습니다.</green>"
repair-nothing: "<red>고칠 것이 없습니다.</red>"
identified: "<gold>정체가 밝혀졌습니다 — {item}</gold>"
deconstructed: "<yellow>{item}<yellow> 을(를) 분해했습니다.</yellow>"

# 장착 칸 (/장비)
equip-locked: "<red>잠긴 칸입니다 — 권한이 있어야 열립니다.</red>"
equip-wrong-type: "<red>이 줄에는 {value} 만 넣을 수 있습니다.</red>"
equip-full: "<red>{value} 칸이 가득 찼습니다.</red>"
equip-bag-full: "<red>가방이 가득 찼습니다.</red>"

# 강화·진화
upgrade-success: "<gold>강화 성공! {item}<gold> <white>+{amount}</white></gold>"
upgrade-fail-keep: "<gray>강화에 실패했습니다. {item}<gray> 은(는) 그대로입니다.</gray>"
upgrade-fail-down: "<red>강화에 실패해 {item}<red> 이(가) <white>+{amount}</white> 로 내려갔습니다.</red>"
upgrade-fail-reset: "<red>강화에 실패해 {item}<red> 이(가) <white>+0</white> 으로 돌아갔습니다.</red>"
upgrade-destroyed: "<dark_red>강화에 실패해 {item}<dark_red> 이(가) 부서졌습니다.</dark_red>"
upgrade-max: "<yellow>{item}<yellow> 은(는) 이미 최대 강화입니다.</yellow>"
upgrade-unidentified: "<red>감정하지 않은 아이템은 강화할 수 없습니다.</red>"
upgrade-wrong-stone: "<red>이 강화석으로는 {item}<red> 을(를) 강화할 수 없습니다.</red>"
upgrade-wrong-level: "<red>이 강화석은 {item}<red> 의 지금 단계에 쓸 수 없습니다.</red>"
evolved: "<light_purple>진화했습니다 — {item}</light_purple>"
evolve-not-ready: "<red>{item}<red> 은(는) 최대 강화해야 진화합니다.</red>"
evolve-wrong-stone: "<red>이 진화석으로는 {item}<red> 을(를) 진화시킬 수 없습니다.</red>"
evolve-missing: "<red>진화 재료가 모자랍니다.</red>"

# 검증 (/커스텀아이템 검증)
verify-done: "<gray>검증 끝 ({value}) — <green>통과 {amount}</green> · <red>실패 {count}</red></gray>"
verify-failure: "<red>✘ {item}</red> <gray>{value}</gray>"
verify-report: "<gray>보고서: <white>{value}</white></gray>"

# 제작
craft-crafted: "<green>만들었습니다.</green>"
craft-queued: "<yellow>대기열에 넣었습니다. 다 되면 제작대에서 받으세요.</yellow>"
craft-claimed: "<green>받았습니다.</green>"
craft-low-level: "<red>레벨 {amount} 이상이어야 만들 수 있습니다.</red>"
craft-no-permission: "<red>이 조합법을 쓸 권한이 없습니다.</red>"
craft-missing: "<red>재료가 모자랍니다.</red>"
craft-queue-full: "<red>대기열이 가득 찼습니다. 다 된 것을 먼저 받으세요.</red>"
craft-empty: "<red>결과가 정해지지 않은 조합법입니다.</red>"
craft-unknown: "<red>'{item}' 제작대가 없습니다.</red>"
craft-usage: "<gray>/제작 <제작대> — 있는 것: <white>{item}</white></gray>"

# --- 공용 ---
no-permission: "<red>권한이 없습니다.</red>"
player-only: "<red>이 명령어는 플레이어만 사용할 수 있습니다.</red>"
not-ready: "<gray>플러그인이 아직 준비 중입니다. 잠시 후 다시 시도해주세요.</gray>"
reloaded: "<green>아이템 {count}개를 다시 불러왔습니다.</green>"

# --- core ChatPrompt 가 요구하는 넷 ---
prompt-enter: "<yellow>채팅으로 값을 입력하세요. <gray>(취소: 취소)</gray></yellow>"
prompt-cancelled: "<gray>입력을 취소했습니다.</gray>"
prompt-timeout: "<gray>입력 시간이 지났습니다.</gray>"
prompt-invalid-number: "<red>숫자를 입력해주세요.</red>"
