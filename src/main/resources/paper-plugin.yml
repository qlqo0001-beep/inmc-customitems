name: inmc-customitems
version: '${version}'
main: com.inmc.customitems.CustomItemsPlugin
# 서버가 켜지기 전에 "빠른 메뉴" 창을 등록하고 빠른 동작 키(기본 G)에 건다 — 레지스트리는 이때만 고칠 수 있다.
bootstrapper: com.inmc.customitems.CustomItemsBootstrap
api-version: '${apiVersion}'   # build.gradle.kts 의 inmc { paper } 에서 유도됨
description: 아이템을 직접 만들어 다른 INMC 플러그인 전부에서 쓰게 하는 플러그인
authors: [ INMC ]

# 연동은 전부 load: OMIT 이다. BEFORE 를 걸면 Paper 가 의존성 순환을 보고 우리 간선을
# 조용히 끊는다 (가이드 함정 1).
dependencies:
  server:
    # 필수 의존은 이것 하나뿐. core 가 kotlin-stdlib 과 공용 프레임워크를 들고 있다.
    inmc-core:      { load: BEFORE, required: true,  join-classpath: true }

# commands 절은 paper-plugin.yml 에 없다 - Brigadier 로 등록한다.
permissions:
  incustomitems.admin:
    description: 커스텀아이템 관리 권한 전체
    default: op
  incustomitems.craft:
    description: 제작대 쓰기 (/제작, 연결한 블록 우클릭)
    default: true
  # 장착 칸. 칸 수 권한은 기본값보다 클 때만 먹는다. 선언해 두는 것은 OP 가 저절로 8칸을 갖지 않게 하려는 것이다.
  incustomitems.equipment:
    description: 장착 칸 쓰기 (/장비)
    default: true
  incustomitems.backpack:
    description: 장착 칸에 끼운 배낭 열기 (/배낭). 손에 든 배낭은 권한 없이 우클릭으로 열린다
    default: true
  incustomitems.slots.accessory.1:
    description: 장신구 장착 칸 1개
    default: false
  incustomitems.slots.accessory.2:
    description: 장신구 장착 칸 2개
    default: false
