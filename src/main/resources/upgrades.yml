# 강화 방식(공용 강화표). /커스텀아이템 관리 → 강화 에서 GUI 로 고치는 것을 권장합니다.
# MMOItems 의 upgrade-templates 에서 옮겨 왔습니다 — "2%" 는 percents(기본 능력치의 %), 나머지는 stats(고정값).
# 성공 확률은 강화석이 정합니다(MMOItems 식). 단계 확률 100 은 "강화석을 따른다"는 뜻입니다.

