# ============================================================
#  inmc-customitems
# ============================================================
#  아이템 자체는 전부 /커스텀아이템 관리 에서 GUI 로 만듭니다.
#  이 파일은 **리소스팩 배포**만 다룹니다.
# ============================================================

# --- 리소스팩 ------------------------------------------------
#  이 플러그인은 팩을 **만들기만** 합니다. 올리는 것은 관리자 몫입니다 —
#  서버 안에 HTTP 서버를 띄우는 것은 포트를 열고 방화벽을 손대고 대역폭을
#  쓰는 일이라, 아이템 플러그인이 조용히 해도 되는 일이 아닙니다.
#
#  만들기:  /커스텀아이템 리팩 빌드
#  결과:    plugins/inmc-customitems/pack/output/pack.zip
#
#  그 zip 을 아무 데나 올리고 주소를 여기 적으면 접속할 때 자동으로 보냅니다.
resource-pack:
  # 올려둔 팩의 주소. 비우면 아무에게도 안 보냅니다.
  url: ""

  # 접속할 때 자동으로 보낼지.
  auto-send: false

  # 거부하면 서버에서 내보낼지.
  required: false

  # 받기 창에 뜨는 문구.
  prompt: "<yellow>서버 리소스팩을 받아주세요.</yellow>"

  # pack.mcmeta 에 적힐 설명.
  description: "INMC 커스텀 아이템"
