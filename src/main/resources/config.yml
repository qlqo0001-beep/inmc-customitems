# ============================================================
#  inmc-customitems
# ============================================================
#  아이템 자체는 전부 /커스텀아이템 관리 에서 GUI 로 만듭니다.
#  이 파일은 **리소스팩 배포**와 **바닥에 떨어진 아이템의 모습**만 다룹니다.
# ============================================================

# --- 바닥에 떨어진 커스텀 아이템 ------------------------------
#  name: 아이템 위에 이름(2개 이상이면 x수량)
#  glow: 등급색으로 빛나기(바닐라 발광 — 벽 너머로도 보입니다)
dropped-items:
  name: true
  glow: true

# --- 리소스팩 ------------------------------------------------
#  만들기:  /커스텀아이템 리팩 빌드
#  결과:    plugins/inmc-customitems/pack/output/pack.zip
#
#  내려주는 길은 둘입니다.
#   1) 그 zip 을 아무 데나 올리고 그 주소를 url 에 적는다.
#   2) 아래 host 를 켜서 이 서버가 직접 내려주게 한다 — 포트를 하나 엽니다.
#      url 에는 플레이어가 닿는 주소를 적습니다. 예: http://play.example.com:8765/pack.zip
#      (같은 PC 에서 테스트할 때만 http://127.0.0.1:8765/pack.zip)
#  어느 쪽이든 접속할 때 자동으로 보냅니다(auto-send).
resource-pack:
  # 플레이어에게 보낼 팩의 주소. 비우면 아무에게도 안 보냅니다.
  url: ""

  # 이 서버가 팩을 직접 내려줄지. 켜면 아래 포트를 엽니다(방화벽·포트 포워딩은 직접).
  # 다시 만들면 바로 새 팩을 내려줍니다. 포트를 못 열면 30초마다 다시 해 봅니다.
  host:
    enabled: false
    # 0.0.0.0 = 모든 네트워크(라이브 서버), 127.0.0.1 = 이 PC 만(테스트)
    bind: "0.0.0.0"
    port: 8765

  # 접속할 때 자동으로 보낼지.
  auto-send: false

  # 거부하면 서버에서 내보낼지.
  required: false

  # 받기 창에 뜨는 문구.
  prompt: "<yellow>서버 리소스팩을 받아주세요.</yellow>"

  # pack.mcmeta 에 적힐 설명.
  description: "INMC 커스텀 아이템"
