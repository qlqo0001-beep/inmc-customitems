# ============================================================
#  역할 아이템의 기본 겉모습
# ============================================================
#  다른 플러그인이 역할을 붙인 아이템(낚시의 물고기·생선살·미끼·낚싯대)에
#  입히는 그림과 등급입니다. 이 파일은 플러그인 안에 들어 있고 서버 폴더로
#  복사되지 않습니다 — 그림(png)만 plugins/inmc-customitems/pack/textures/ 에 깔립니다.
#
#  - 겉모습(텍스처·모델·모델 번호)이 **없는** 아이템에만 입힙니다.
#    관리자가 한 번 바꾼 것은 다시 덮지 않습니다.
#  - png 는 없을 때만 깝니다. 같은 이름으로 바꿔 넣으면 그 그림이 쓰입니다.
#  - 입힌 뒤 /커스텀아이템 리팩 빌드 로 팩을 다시 만들어 올려야 보입니다.
#
#  role   역할 열쇠   match  역할 값 중 같아야 하는 것
#  tier   common / uncommon / rare / epic / legendary / mythic    glow  반짝임
#
#  물고기·생선살 등급: F 일반 · E 고급 · D 희귀 · C 영웅 · B 영웅(반짝임) · A 전설(반짝임) · S 신화(반짝임)
# ============================================================
